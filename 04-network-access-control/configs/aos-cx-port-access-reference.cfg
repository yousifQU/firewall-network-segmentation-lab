! Aruba AOS-CX reference snippet for PacketFence out-of-band (VLAN) enforcement
! Template only. NOT re-tested. AOS-CX syntax differs between firmware releases:
! confirm against the PacketFence network-device guide for Aruba CX and the
! switch's AAA documentation.
!
! Assumed addressing: PacketFence 192.168.3.20 (RADIUS), switch management 192.168.3.60

hostname access-sw1

vlan 10
    name REGISTRATION
vlan 20
    name ISOLATION
vlan 100
    name PRODUCTION

! RADIUS server (add "vrf <name>" if PacketFence is reached through a non-default VRF, such as mgmt)
radius-server host 192.168.3.20 key plaintext <RADIUS_SHARED_SECRET>

aaa group server radius PACKETFENCE
    server 192.168.3.20

! Change of Authorization, so PacketFence can re-evaluate a port after registration
radius dyn-authorization enable
radius dyn-authorization client 192.168.3.20 secret-key plaintext <RADIUS_SHARED_SECRET>

! Port-access methods: 802.1X where a supplicant exists, MAC authentication bypass otherwise
aaa authentication port-access dot1x authenticator
    radius server-group PACKETFENCE
    enable
aaa authentication port-access mac-auth
    radius server-group PACKETFENCE
    addr-format no-delimiter lower-case
    enable

! Endpoint-facing ports
interface 1/1/1-1/1/2
    no shutdown
    no routing
    vlan access 10
    aaa authentication port-access dot1x authenticator
        enable
    aaa authentication port-access mac-auth
        enable
