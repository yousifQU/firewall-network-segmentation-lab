# VyOS Site B firewall: reference configuration (VyOS 1.5-series syntax)
# Normalized and corrected during editing. NOT re-tested. Verify against the
# VyOS documentation for your release before use.
#
# eth0 = WAN (public)   eth1 = DMZ-B   eth2 = HQ-B

# --- Interfaces and routing ---
set interfaces ethernet eth0 address '203.0.113.4/24'
set interfaces ethernet eth0 description 'WAN-Public'
set interfaces ethernet eth1 address '172.16.10.1/24'
set interfaces ethernet eth1 description 'DMZ-B'
set interfaces ethernet eth2 address '192.168.2.1/24'
set interfaces ethernet eth2 description 'HQ-B'
set protocols static route 0.0.0.0/0 next-hop '203.0.113.1'

# --- Source NAT: internet access for HQ-B only, scoped to the WAN interface ---
set nat source rule 10 description 'HQ-B to WAN (masquerade)'
set nat source rule 10 outbound-interface name 'eth0'
set nat source rule 10 source address '192.168.2.0/24'
set nat source rule 10 translation address 'masquerade'

# --- Destination NAT: publish DMZ services on the WAN address ---
set nat destination rule 20 description 'HTTP to DMZ-B'
set nat destination rule 20 inbound-interface name 'eth0'
set nat destination rule 20 destination address '203.0.113.4'
set nat destination rule 20 destination port '80'
set nat destination rule 20 protocol 'tcp'
set nat destination rule 20 translation address '172.16.10.10'

set nat destination rule 21 description 'FTP control to DMZ-B'
set nat destination rule 21 inbound-interface name 'eth0'
set nat destination rule 21 destination address '203.0.113.4'
set nat destination rule 21 destination port '21'
set nat destination rule 21 protocol 'tcp'
set nat destination rule 21 translation address '172.16.10.10'

set nat destination rule 22 description 'TFTP to DMZ-B'
set nat destination rule 22 inbound-interface name 'eth0'
set nat destination rule 22 destination address '203.0.113.4'
set nat destination rule 22 destination port '69'
set nat destination rule 22 protocol 'udp'
set nat destination rule 22 translation address '172.16.10.10'

# --- Connection-tracking helpers for FTP data and TFTP transfers ---
# (FTP passive data ports must also be fixed on the server and allowed below.)
set system conntrack modules ftp
set system conntrack modules tftp

# --- Stateful baseline ---
set firewall global-options state-policy established action 'accept'
set firewall global-options state-policy related action 'accept'
set firewall global-options state-policy invalid action 'drop'

# --- Forward chain (traffic THROUGH the router): default deny ---
set firewall ipv4 forward filter default-action 'drop'

set firewall ipv4 forward filter rule 10 description 'Public to DMZ-B: HTTP and FTP'
set firewall ipv4 forward filter rule 10 action 'accept'
set firewall ipv4 forward filter rule 10 inbound-interface name 'eth0'
set firewall ipv4 forward filter rule 10 destination address '172.16.10.10'
set firewall ipv4 forward filter rule 10 protocol 'tcp'
set firewall ipv4 forward filter rule 10 destination port '80,21'

set firewall ipv4 forward filter rule 20 description 'Public to DMZ-B: TFTP'
set firewall ipv4 forward filter rule 20 action 'accept'
set firewall ipv4 forward filter rule 20 inbound-interface name 'eth0'
set firewall ipv4 forward filter rule 20 destination address '172.16.10.10'
set firewall ipv4 forward filter rule 20 protocol 'udp'
set firewall ipv4 forward filter rule 20 destination port '69'

set firewall ipv4 forward filter rule 30 description 'HQ-B to WAN'
set firewall ipv4 forward filter rule 30 action 'accept'
set firewall ipv4 forward filter rule 30 inbound-interface name 'eth2'
set firewall ipv4 forward filter rule 30 outbound-interface name 'eth0'

set firewall ipv4 forward filter rule 31 description 'HQ-B to DMZ-B'
set firewall ipv4 forward filter rule 31 action 'accept'
set firewall ipv4 forward filter rule 31 inbound-interface name 'eth2'
set firewall ipv4 forward filter rule 31 outbound-interface name 'eth1'

# DMZ-B to HQ-B and WAN to HQ-B are denied by the default action.

# --- Input chain (traffic TO the router): default deny, minimal management ---
set firewall ipv4 input filter default-action 'drop'

set firewall ipv4 input filter rule 5 description 'ICMP (ping, traceroute)'
set firewall ipv4 input filter rule 5 action 'accept'
set firewall ipv4 input filter rule 5 protocol 'icmp'

set firewall ipv4 input filter rule 10 description 'SSH from HQ-B only'
set firewall ipv4 input filter rule 10 action 'accept'
set firewall ipv4 input filter rule 10 inbound-interface name 'eth2'
set firewall ipv4 input filter rule 10 protocol 'tcp'
set firewall ipv4 input filter rule 10 destination port '22'

commit
save
