# VyOS-1 (HQ-B): L2TP/IPsec remote access with RADIUS (DC-B)
# Reference configuration: corrected during editing, NOT re-tested.
# L2TP with a shared pre-shared key is a legacy design. Prefer IKEv2 for new deployments.

set vpn ipsec interface 'eth0'

set vpn l2tp remote-access outside-address '203.0.113.4'
set vpn l2tp remote-access gateway-address '192.168.255.1'
set vpn l2tp remote-access client-ip-pool L2TP-POOL range '192.168.255.2-192.168.255.200'
set vpn l2tp remote-access default-pool 'L2TP-POOL'

set vpn l2tp remote-access ipsec-settings authentication mode 'pre-shared-secret'
set vpn l2tp remote-access ipsec-settings authentication pre-shared-secret '<L2TP_IPSEC_PSK>'

set vpn l2tp remote-access authentication mode 'radius'
set vpn l2tp remote-access authentication radius server 192.168.2.10 key '<RADIUS_SHARED_SECRET>'
# Source address NPS will see; register this address as a RADIUS client in NPS.
set vpn l2tp remote-access authentication radius source-address '192.168.2.1'

set vpn l2tp remote-access name-server '192.168.2.10'

# Windows client: Settings → Network & Internet → VPN → Add
#   VPN type: L2TP/IPsec with pre-shared key; sign-in: user name and password
