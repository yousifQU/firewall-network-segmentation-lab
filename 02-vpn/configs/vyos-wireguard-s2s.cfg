# VyOS-1 (HQ-B) <-> VyOS-2 (Remote-B) WireGuard site-to-site
# Reference configuration: corrected during editing, NOT re-tested.
# Never commit real keys. Generate on each router:
#   generate pki wireguard key-pair install interface wg0
# Exchange only the PUBLIC keys.

### VyOS-1 (HQ-B): WAN 203.0.113.4, LAN 192.168.2.0/24 ###
set interfaces wireguard wg0 address '10.10.10.1/24'
set interfaces wireguard wg0 description 'S2S to Remote-B'
set interfaces wireguard wg0 port '51820'
set interfaces wireguard wg0 peer REMOTE-B address '203.0.113.9'
set interfaces wireguard wg0 peer REMOTE-B port '51820'
set interfaces wireguard wg0 peer REMOTE-B public-key '<VYOS2_PUBLIC_KEY>'
set interfaces wireguard wg0 peer REMOTE-B allowed-ips '10.10.10.2/32'
set interfaces wireguard wg0 peer REMOTE-B allowed-ips '192.168.6.0/24'
set interfaces wireguard wg0 peer REMOTE-B persistent-keepalive '25'
set protocols static route 192.168.6.0/24 next-hop '10.10.10.2'

set firewall ipv4 input filter rule 40 description 'WireGuard from Remote-B'
set firewall ipv4 input filter rule 40 action 'accept'
set firewall ipv4 input filter rule 40 protocol 'udp'
set firewall ipv4 input filter rule 40 destination port '51820'
set firewall ipv4 input filter rule 40 source address '203.0.113.9'

set firewall ipv4 forward filter rule 40 description 'Remote-B to HQ-B'
set firewall ipv4 forward filter rule 40 action 'accept'
set firewall ipv4 forward filter rule 40 inbound-interface name 'wg0'
set firewall ipv4 forward filter rule 40 outbound-interface name 'eth2'
set firewall ipv4 forward filter rule 41 description 'HQ-B to Remote-B'
set firewall ipv4 forward filter rule 41 action 'accept'
set firewall ipv4 forward filter rule 41 inbound-interface name 'eth2'
set firewall ipv4 forward filter rule 41 outbound-interface name 'wg0'

### VyOS-2 (Remote-B): WAN 203.0.113.9, LAN 192.168.6.0/24 ###
# Mirror image of the above:
#   wg0 address 10.10.10.2/24
#   peer HQ-B address 203.0.113.4, public-key <VYOS1_PUBLIC_KEY>
#   allowed-ips 10.10.10.1/32 and 192.168.2.0/24
#   static route 192.168.2.0/24 next-hop 10.10.10.1
#   matching input/forward rules, with eth1 as the LAN interface
