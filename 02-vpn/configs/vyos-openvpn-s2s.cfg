# VyOS-1 side of the OpenVPN shared-key site-to-site tunnel (DMZ-B <-> DMZ-A)
# Reference configuration: corrected during editing, NOT re-tested.
# pfSense-1 is the server: tunnel 10.200.1.0/30 (pfSense .1, VyOS .2).
# Cipher and digest must match pfSense (AES-256-CBC / SHA512).
# Shared-key mode is deprecated; use TLS mode outside a lab.

set pki openvpn shared-secret OVPN_S2S key '<STATIC_KEY_GENERATED_ON_PFSENSE>'
set pki openvpn shared-secret OVPN_S2S version '1'

set interfaces openvpn vtun10 description 'S2S to DMZ-A'
set interfaces openvpn vtun10 mode 'site-to-site'
set interfaces openvpn vtun10 protocol 'udp'
set interfaces openvpn vtun10 local-address '10.200.1.2'
set interfaces openvpn vtun10 remote-address '10.200.1.1'
set interfaces openvpn vtun10 remote-host '203.0.113.6'
set interfaces openvpn vtun10 remote-port '1194'
set interfaces openvpn vtun10 shared-secret-key 'OVPN_S2S'
set interfaces openvpn vtun10 encryption cipher 'aes256'
set interfaces openvpn vtun10 hash 'sha512'

# Route to DMZ-A through the tunnel
set protocols static route 192.168.3.0/24 next-hop '10.200.1.1'

# Allow DMZ-to-DMZ traffic over the tunnel only
set firewall ipv4 forward filter rule 50 description 'DMZ-A to DMZ-B via tunnel'
set firewall ipv4 forward filter rule 50 action 'accept'
set firewall ipv4 forward filter rule 50 inbound-interface name 'vtun10'
set firewall ipv4 forward filter rule 50 outbound-interface name 'eth1'
set firewall ipv4 forward filter rule 51 description 'DMZ-B to DMZ-A via tunnel'
set firewall ipv4 forward filter rule 51 action 'accept'
set firewall ipv4 forward filter rule 51 inbound-interface name 'eth1'
set firewall ipv4 forward filter rule 51 outbound-interface name 'vtun10'
