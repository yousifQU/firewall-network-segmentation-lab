# VyOS-2 (Remote-B): IKEv2 remote-access VPN, server authenticated by certificate,
# users authenticated by RADIUS (DC-B, reached across the WireGuard S2S tunnel).
# Reference configuration based on the VyOS remote-access documentation.
# NOT re-tested; syntax varies by release.

# Certificates: create a CA and a server certificate whose name/SAN matches the
# address or FQDN clients connect to, then install the CA on the client.
#   generate pki ca install LAB_CA
#   generate pki certificate sign LAB_CA install VPN_SERVER

set vpn ipsec interface 'eth0'

set vpn ipsec esp-group ESP-RW lifetime '3600'
set vpn ipsec esp-group ESP-RW pfs 'dh-group14'
set vpn ipsec esp-group ESP-RW proposal 10 encryption 'aes256'
set vpn ipsec esp-group ESP-RW proposal 10 hash 'sha256'

set vpn ipsec ike-group IKE-RW key-exchange 'ikev2'
set vpn ipsec ike-group IKE-RW lifetime '7200'
set vpn ipsec ike-group IKE-RW proposal 10 dh-group '14'
set vpn ipsec ike-group IKE-RW proposal 10 encryption 'aes256'
set vpn ipsec ike-group IKE-RW proposal 10 hash 'sha256'

set vpn ipsec remote-access connection RW authentication server-mode 'x509'
set vpn ipsec remote-access connection RW authentication x509 ca-certificate 'LAB_CA'
set vpn ipsec remote-access connection RW authentication x509 certificate 'VPN_SERVER'
set vpn ipsec remote-access connection RW authentication local-id '203.0.113.9'
set vpn ipsec remote-access connection RW authentication client-mode 'eap-radius'
set vpn ipsec remote-access connection RW esp-group 'ESP-RW'
set vpn ipsec remote-access connection RW ike-group 'IKE-RW'
set vpn ipsec remote-access connection RW local-address '203.0.113.9'
set vpn ipsec remote-access connection RW pool 'RW-POOL'

# One address pool only (a prefix distinct from the LAN)
set vpn ipsec remote-access pool RW-POOL prefix '192.168.200.0/24'
set vpn ipsec remote-access pool RW-POOL name-server '192.168.2.10'

# RADIUS: DC-B. Register VyOS-2 in NPS using the address NPS will see
# (the WireGuard tunnel address 10.10.10.2).
set vpn ipsec remote-access radius server 192.168.2.10 key '<RADIUS_SHARED_SECRET>'

# Windows client profile can be generated on the router:
#   generate ipsec profile windows-remote-access connection RW remote 203.0.113.9
